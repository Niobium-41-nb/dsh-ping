# dsh-ping bundle layer: mount the desktop-notification plugin.
#
# The host half watches host events only (turn end, agent error, pending
# approval, pending question). Its browser half (declared in package.json as
# `dsh.client`) is a hand-written lazy-CJS bundle that imports nothing, renders
# nothing and only posts two booleans to /dsh-ping/presence, so a failure there
# cannot affect what the Web client loads.
- insert:
    - id: dsh-ping
      name: 'dsh-ping'
